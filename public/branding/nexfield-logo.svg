<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="greenCol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#143926" />
    </linearGradient>
    <linearGradient id="wheatBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B996" />
      <stop offset="100%" stop-color="#A27D4C" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>

  <!-- Background tile matching official logo warm sand/cream -->
  <rect width="100" height="100" rx="22" fill="#F4ECE1" />

  <!-- Left Green Vertical Column -->
  <path d="M 29 37 L 40 48 L 40 62 L 29 70 Z" fill="url(#greenCol)" />

  <!-- Middle Wheat/Sand Curved Ribbon -->
  <path d="M 30 34 C 38 33, 44 38, 51 46 L 68 66 L 68 71 C 62 70, 56 63, 48 52 L 31 35 Z" fill="url(#wheatBand)" />

  <!-- Right Leaf Element -->
  <path d="M 57 52 C 55 45, 57 37, 63 31 C 68 26, 72 27, 72 27 C 72 32, 69 44, 59 52 Z" fill="url(#leafGrad)" />
  <!-- Leaf Central Slit -->
  <path d="M 57 50 C 62 43, 67 36, 68 33" stroke="#F4ECE1" stroke-width="1.8" stroke-linecap="round" fill="none" />
</svg>
