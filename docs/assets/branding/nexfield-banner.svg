<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D0B"/>
      <stop offset="50%" stop-color="#0E1612"/>
      <stop offset="100%" stop-color="#070A09"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14231A" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#10B981" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="#1E2E25" stroke-width="1.5"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="160" cy="160" r="90" fill="#10B981" fill-opacity="0.12" filter="url(#emeraldGlow)"/>

  <!-- Left: Stylized Agronomic Hexagon Emblem -->
  <g transform="translate(160, 160)">
    <!-- Hexagon Outer -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="#0C1410" stroke="#1B3324" stroke-width="2.5"/>
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#111B15" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Sprout / Foliar Geometry -->
    <path d="M 0,28 C -22,-2 -16,-36 0,-44 C 16,-36 22,-2 0,28 Z" fill="url(#emeraldGrad)"/>
    <path d="M 0,28 L 0,-42" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0,6 C -14,-2 -18,-14 -14,-22 C -6,-20 -2,-12 0,6 Z" fill="#6EE7B7"/>
    <path d="M 0,-4 C 14,-12 18,-24 14,-32 C 6,-30 2,-22 0,-4 Z" fill="#A7F3D0"/>
    
    <!-- Sensor Data Nodes -->
    <circle cx="-38" cy="-22" r="3" fill="#10B981"/>
    <circle cx="38" cy="-22" r="3" fill="#34D399"/>
    <circle cx="0" cy="46" r="3" fill="#059669"/>
    <line x1="-38" y1="-22" x2="-22" y2="-12" stroke="#10B981" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="38" y1="-22" x2="22" y2="-12" stroke="#34D399" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Right: Title, Hierarchy & Subtitle -->
  <g transform="translate(290, 85)">
    <!-- Badge Pill -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0E1A13" stroke="#223C2B" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">ADAPPT 5.0 • DOMAIN 2</text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#F1F6F3" letter-spacing="1.5">NEXFIELD</text>

    <!-- Subtitle / Platform Name -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#9FB7A9" letter-spacing="0.4">The Agricultural Intelligence Operating System</text>

    <!-- Mission Tagline -->
    <text x="0" y="146" font-family="'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" font-weight="500" fill="#6EE7B7" letter-spacing="0.8">OBSERVE • PREDICT • SIMULATE • OPTIMIZE • GROW</text>
  </g>

  <!-- Corner Status Indicator -->
  <g transform="translate(1030, 36)">
    <rect x="0" y="0" width="134" height="28" rx="6" fill="#101A14" stroke="#1D3325" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10B981"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#A7F3D0">PRODUCTION v1.0</text>
  </g>
</svg>
